# Manifesto de teste do cliente atlas, ambiente prod.
# Segunda entrada do teste cego. Nenhuma anotação sobre regras, de propósito.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-api
  namespace: atlas-prod
  labels:
    app.kubernetes.io/name: atlas-api
    app.kubernetes.io/instance: atlas-prod
    app.kubernetes.io/part-of: atlas
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: time-atlas
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
  namespace: atlas-prod
  labels:
    app.kubernetes.io/name: atlas-api
    app.kubernetes.io/instance: atlas-prod
    app.kubernetes.io/part-of: atlas
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: time-atlas
    metacortex.io/runbook: https://wiki.metacortex.io/runbooks/atlas-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-api
      app.kubernetes.io/instance: atlas-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-api
        app.kubernetes.io/instance: atlas-prod
        app.kubernetes.io/part-of: atlas
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: atlas-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      containers:
        - name: api
          image: registry.metacortex.io/atlas/api:2.8.1
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: DB_HOST, value: atlas-postgres}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: atlas-db, key: password}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits:   {cpu: 1,    memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-api
  namespace: atlas-prod
  labels:
    app.kubernetes.io/name: atlas-api
    app.kubernetes.io/instance: atlas-prod
    app.kubernetes.io/part-of: atlas
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: time-atlas
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: atlas-api
    app.kubernetes.io/instance: atlas-prod
  ports:
    - {name: http, port: 80, targetPort: http, protocol: TCP}
