# Manifesto de teste do cliente vega, ambiente stg.
# Entrada do teste cego da skill. Nenhuma anotação sobre regras, de propósito.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vega-cache-config
  namespace: vega-stg
data:
  CACHE_TTL: "300"
  CACHE_BACKEND_URL: "mysql://vega:T0rr3-f0rt3@mysql.vega-stg.svc:3306/vega"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vega-cache
  namespace: vega-stg
  labels:
    app.kubernetes.io/name: vega-cache
    app.kubernetes.io/instance: vega-stg
    app.kubernetes.io/part-of: vega
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: time-vega
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vega-cache
  namespace: vega-stg
  labels:
    app.kubernetes.io/name: vega-cache
    app.kubernetes.io/instance: vega-stg
    app.kubernetes.io/part-of: vega
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: time-vega
    metacortex.io/runbook: https://wiki.metacortex.io/runbooks/vega-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vega-cache
      app.kubernetes.io/instance: vega-stg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vega-cache
        app.kubernetes.io/instance: vega-stg
        app.kubernetes.io/part-of: vega
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: vega-cache
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cache
          image: docker.io/redis:7-alpine
          ports:
            - {name: redis, containerPort: 6379}
          envFrom:
            - configMapRef: {name: vega-cache-config}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: redis}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m,  memory: 64Mi}
            limits:   {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: dados, mountPath: /data}
      volumes:
        - name: dados
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vega-cache
  namespace: vega-stg
  labels:
    app.kubernetes.io/name: vega-cache
    app.kubernetes.io/instance: vega-stg
    app.kubernetes.io/part-of: vega
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: time-vega
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vega-cache
    app.kubernetes.io/instance: vega-staging
  ports:
    - {name: redis, port: 6379, targetPort: redis, protocol: TCP}
