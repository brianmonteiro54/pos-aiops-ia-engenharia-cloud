# Chamado 2: orion-stg: a loja do fake-shop parou depois de uma publicacao do Loom.
# "A tag nova foi anunciada no release e o deploy foi aplicado, mas o pod nunca foi
#  substituido."
#
# Manifesto exatamente como veio no enunciado.
apiVersion: v1
kind: Namespace
metadata:
  name: orion-stg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-postgres
  namespace: orion-stg
spec:
  replicas: 1
  selector:
    matchLabels: {app: orion-postgres}
  template:
    metadata:
      labels: {app: orion-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB,       value: ecommerce}
            - {name: POSTGRES_USER,     value: ecommerce}
            - {name: POSTGRES_PASSWORD, value: "Pg1234"}
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: orion-postgres
  namespace: orion-stg
spec:
  selector: {app: orion-postgres}
  ports:
    - {port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-web
  namespace: orion-stg
spec:
  replicas: 3
  selector:
    matchLabels: {app: orion-web}
  template:
    metadata:
      labels: {app: orion-web}
    spec:
      containers:
        - name: web
          image: fabricioveronez/fake-shop:v1.14.2
          ports:
            - containerPort: 5000
          env:
            - {name: DB_HOST,     value: orion-postgres}
            - {name: DB_NAME,     value: ecommerce}
            - {name: DB_USER,     value: ecommerce}
            - {name: DB_PASSWORD, value: "Pg1234"}
            - {name: FLASK_APP,   value: index.py}
            - {name: PROMETHEUS_MULTIPROC_DIR, value: /tmp/metrics}
---
apiVersion: v1
kind: Service
metadata:
  name: orion-web
  namespace: orion-stg
spec:
  selector: {app: orion-web}
  ports:
    - {port: 80, targetPort: 5000}
